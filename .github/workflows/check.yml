name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU-only torch keeps the install small; no model weights are downloaded.
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m marimo check rag_marimo.py
      - run: python validate_lab6.py
